; StraddleReplica STARWAVE_30 structural replay.
; Reproduces the Starwave / Target account (magic 26011001, XAUUSD.u,
; $1,000 USDT-TRC20 deposit on 2026-08-21).  TradeSymbol is left blank in
; starwave_30.set so the EA follows the tester symbol; point Symbol= at
; whatever gold symbol the broker exposes (XAUUSD, XAUUSD.u, ...).
; This configuration runs only in Strategy Tester and uses broker real ticks.
[Tester]
Expert=StraddleReplica\StraddleReplica.ex5
ExpertParameters=starwave_30.set
Symbol=XAUUSD
Period=M1
Optimization=0
Model=4
FromDate=2026.08.21
ToDate=2026.08.29
ForwardMode=0
Deposit=1000
Currency=USD
ProfitInPips=0
Leverage=1:1000
ExecutionMode=0
OptimizationCriterion=0
Visual=0
UseLocal=1
UseRemote=0
UseCloud=0
Report=StraddleReplica_starwave_30
ReplaceReport=1
ShutdownTerminal=1

[TesterInputs]
Profile=7||7||1||7||N
TradeSymbol=||||0||||N
MagicNumber=26011001||26011001||1||26011001||N
ReplicaMode=true||false||0||true||N
InterOrderDelayMs=100||100||1||100||N
DeviationPoints=100||100||1||100||N
TelemetryEnabled=true||false||0||true||N
SafetyEnabled=false||false||0||true||N
